server:
  port: ${PORT:53919}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cuscrud-backend
  jackson:
    time-zone: America/Recife

cuscrud:
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-secret}
  database:
    url: ${DB_URL:}
    user: ${DB_USER:}
    password: ${DB_PASSWORD:}
